# CI — the gates the owner currently runs by hand, now on every PR (issue #252).
#
# Repo layout: the git root is the worktree top; the operational app lives in apps/web and the
# GES Oversight app in apps/oversight (each a self-contained project with its own pnpm-lock.yaml —
# per-app installs, no hoisted workspace). This file sits at .github/workflows/ (repo root) next
# to pr-project-tracking.yml, and every app command runs with `pnpm -C apps/<app> ...`.
#
# Jobs:
#   verify           — apps/web: typecheck + vitest + next build (the hand-run gates).
#   oversight-verify — apps/oversight: typecheck + next build.
#   migration-replay — apply the FULL apps/web/db/migrations/* chain from an EMPTY postgres:16,
#                      catching composite-FK / ordering regressions (the 0033 class) that
#                      no local or verify step exercises.
#
# No real secrets: `next build` needs no env (lib/env.ts defaults are permissive and the app
# is force-dynamic, so the build never opens a DB connection — proven locally). The replay
# job talks only to a throwaway service-container Postgres.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs for the same ref (a new push to a PR kills the in-flight run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so `cache: pnpm` can resolve the store path.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm -C apps/web install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C apps/web typecheck

      - name: Test
        run: pnpm -C apps/web test

      - name: Build
        run: pnpm -C apps/web build

  oversight-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/oversight/pnpm-lock.yaml

      - name: Install
        run: pnpm -C apps/oversight install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C apps/oversight typecheck

      - name: Build
        run: pnpm -C apps/oversight build

  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omnischools
          POSTGRES_PASSWORD: omnischools
          POSTGRES_DB: omnischools_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnischools -d omnischools_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # drizzle.config.ts reads process.env.DATABASE_URL (its dotenv .env.local load is a
      # no-op in CI); point it at the throwaway service DB.
      DATABASE_URL: postgresql://omnischools:omnischools@localhost:5432/omnischools_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm -C apps/web install --frozen-lockfile

      # `drizzle-kit migrate` walks db/migrations/meta/_journal.json and applies every .sql
      # from empty; it exits non-zero if any migration errors (e.g. a composite FK created
      # before its target UNIQUE — the 0033 class). This is what no local step does.
      - name: Replay migrations from empty
        run: pnpm -C apps/web db:migrate
